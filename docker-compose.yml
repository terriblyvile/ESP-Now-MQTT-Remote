# docker compose up -d --build   ->   http://<this-machine>:8765
#
# -d detaches, so it keeps running once you close the terminal, and
# `restart: unless-stopped` brings it back after a reboot.
#
# Flashing from a container needs the host to hand over a serial port. That
# works on Linux; Docker Desktop on macOS and Windows cannot do it at all. See
# the README before assuming this will flash anything.

services:
  flasher:
    build: .
    container_name: espnow-flasher

    # Reachable from other machines on your network, which is the point of
    # running it on a server. Change to "127.0.0.1:8765:8765" to restrict it to
    # the server itself.
    #
    # Anyone who can reach this port can read the stored WiFi, MQTT and OTA
    # passwords -- the UI prefills them, so the API returns them -- and can
    # start builds. Set FLASHER_PASSWORD below unless the network is one you
    # fully trust.
    ports:
      - "8765:8765"

    # Survives closing the terminal, a Docker daemon restart, and a reboot.
    # Start it detached so it does not hold the terminal in the first place:
    #   docker compose up -d --build
    restart: unless-stopped

    environment:
      # Uncomment to require a login. Username defaults to "flasher"; override
      # with FLASHER_USERNAME. Basic auth over plain HTTP keeps other people on
      # the network out, but is not encrypted -- put it behind a TLS reverse
      # proxy if the network is hostile.
      # FLASHER_PASSWORD: "choose-something"
      # FLASHER_USERNAME: "flasher"
      #
      # Passed through from your shell if set, so you can keep it out of this
      # file entirely: FLASHER_PASSWORD=... docker compose up -d
      FLASHER_PASSWORD: "${FLASHER_PASSWORD:-}"
      FLASHER_USERNAME: "${FLASHER_USERNAME:-flasher}"

    volumes:
      # Your working copy. The app writes secrets.h, device_config.h and
      # platformio_local.ini into it, and builds read your edits from it.
      - .:/project
      # ~500MB of ESP32 toolchain. Named so a rebuild does not refetch it.
      - pio-cache:/pio

    # Starts as root and immediately becomes whoever owns the mounted project,
    # so generated files come out owned by you without you having to look your
    # uid up. Override only if you need a specific one -- and note these are
    # deliberately not called UID/GID, which are readonly in bash and zsh and
    # therefore cannot be set the way you would expect:
    #   FLASHER_UID=$(id -u) FLASHER_GID=$(id -g) docker compose up -d
    user: "${FLASHER_UID:-0}:${FLASHER_GID:-0}"

    # ---- serial access, Linux only -------------------------------------
    # Uncomment and set to your board's actual device. `ls /dev/ttyUSB*` or
    # `ls /dev/ttyACM*` with the board plugged in. It must exist at start or
    # the container will not come up, which is why it ships commented out.
    #
    # devices:
    #   - "/dev/ttyUSB0:/dev/ttyUSB0"
    #
    # A board that re-enumerates on reset can change device path mid-session.
    # If that bites, mount the bus instead -- broader access, so prefer the
    # explicit device above where you can:
    #
    # volumes:
    #   - /dev:/dev
    # group_add:
    #   - dialout
    # --------------------------------------------------------------------

volumes:
  pio-cache:
