; One repo, two firmwares that talk over ESP-NOW:
;
;   remote_* -> battery handset. Reads buttons, sends the command, sleeps.
;               One environment per physical remote.
;   hub / hub_eth -> mains-powered base station. Receives ESP-NOW, republishes
;               to MQTT for Home Assistant. Wireless or wired.
;
; Both hubs can run at once. Each remote unicasts to one hub's MAC, so a press
; reaches exactly one of them.
;
;   pio run -e remote_office -t upload
;   pio run -e hub_eth -t upload

[platformio]
default_envs = remote_livingroom, remote_office, remote_bedroom, hub, hub_eth

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags = -Wall

; ---------------------------------------------------------------------------
; REMOTES
; ---------------------------------------------------------------------------
; One environment per physical remote. Its location is compiled in and travels
; in every packet, so hubs tell remotes apart without knowing their MACs. Each
; location must match a row in REMOTE_LOCATION_TABLE in include/config.h --
; tools/check_discovery.sh enforces that.
;
; Add -DHUB_MAC_ADDRESS=HUB_MAC_WIRELESS to point a remote at the wireless hub;
; the default is the wired one.

[remote_base]
board = lolin32_lite
build_src_filter = -<*> +<remote/>

[env:remote_livingroom]
extends = remote_base
build_flags = ${env.build_flags} -DREMOTE_LOCATION='"livingroom"'

[env:remote_office]
extends = remote_base
build_flags = ${env.build_flags} -DREMOTE_LOCATION='"office"'

[env:remote_bedroom]
extends = remote_base
build_flags = ${env.build_flags} -DREMOTE_LOCATION='"bedroom"'

; ---------------------------------------------------------------------------
; HUBS
; ---------------------------------------------------------------------------
; Same firmware, differing only in how they reach the broker. HUB_ID keeps their
; identities apart: without it both would claim the same MQTT client id, and the
; broker would disconnect whichever connected first, repeatedly.
;
; ESP-NOW rides the WiFi radio either way, so the radio is powered up in both.

[hub_base]
build_src_filter = -<*> +<hub/>
lib_deps = knolleary/PubSubClient@^2.8

; Reaches the broker over WiFi. Plain ESP32.
[env:hub]
extends = hub_base
board = esp32dev
build_flags = ${env.build_flags} -DHUB_ID='"wifi"'

; Reaches the broker over Ethernet. Never associates with an access point, so
; nothing can move its ESP-NOW channel off WIFI_CHANNEL -- see src/hub/network.h.
;
; The wt32-eth01 board definition ships a 4MB flash size; this module has 8MB,
; so the size, upload ceiling and partition table are overridden. default_8MB.csv
; gives two 3.3MB OTA slots.
[env:hub_eth]
extends = hub_base
board = wt32-eth01
build_flags = ${env.build_flags} -DHUB_ID='"eth"' -DHUB_USE_ETHERNET=1
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv

; Flashed over the air instead of over USB. tools/ota_auth.py reads OTA_PASSWORD
; from include/secrets.h and passes --auth; without it the upload fails with a
; misleading "Host ... Not Found".
[ota]
upload_protocol = espota
extra_scripts = post:tools/ota_auth.py

[env:hub_ota]
extends = env:hub, ota
upload_port = esp_hub_wifi.local

[env:hub_eth_ota]
extends = env:hub_eth, ota
upload_port = esp_hub_eth.local
